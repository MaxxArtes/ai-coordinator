[package]
name = "ai-coordinator-desktop"
version = "0.6.0"
description = "AI Coordinator Desktop Native Shell"
authors = ["AI Coordinator Team"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

[lib]
name = "ai_coordinator_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
sysinfo = "0.30"
portable-pty = "0.8"
