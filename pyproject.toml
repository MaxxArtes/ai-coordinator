[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coordinator"
version = "0.5.0"
description = "Portable shared task state and bounded routing for local AI coding agents"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["ai-agents", "mcp", "agent-skills", "coordination"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
ai-coordinator = "ai_coordinator.cli:main"
ai-coordinator-mcp = "ai_coordinator.mcp_server:main"

[project.urls]
Homepage = "https://github.com/MaxxArtes/ai-coordinator"
Repository = "https://github.com/MaxxArtes/ai-coordinator"
Issues = "https://github.com/MaxxArtes/ai-coordinator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_coordinator = ["routes.example.json", "COORDINATOR.example.md", "py.typed"]
