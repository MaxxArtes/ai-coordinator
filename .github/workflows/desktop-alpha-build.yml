name: Build Desktop Alpha (Windows)

on:
  push:
    branches:
      - 'feature/**'
      - 'desktop/**'
  pull_request:
    branches:
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tauri-windows:
    name: Build Tauri 2 Windows Executable (Alpha)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Setup Host Python for Build Tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Provision Bundled Python Build Standalone Runtime
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "=== Provisioning Python Build Standalone for Windows x86_64 ==="
          $specFile = "desktop/runtime/python_spec.json"
          $spec = Get-Content $specFile | ConvertFrom-Json
          $winSpec = $spec.platforms.'windows-x86_64'
          $url = $winSpec.url
          $expectedHash = $winSpec.sha256
          $tarPath = "desktop/runtime/python_standalone.tar.gz"

          Write-Host "Downloading PBS from: $url"
          Invoke-WebRequest -Uri $url -OutFile $tarPath

          $actualHash = (Get-FileHash $tarPath -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $expectedHash.ToLower()) {
              Write-Error "SHA256 mismatch! Expected $expectedHash, got $actualHash"
              exit 1
          }
          Write-Host "SHA256 verified successfully: $actualHash"

          # Extract to desktop/src-tauri/resources/runtime/
          $resRuntime = "desktop/src-tauri/resources/runtime"
          New-Item -ItemType Directory -Force -Path $resRuntime
          Write-Host "Extracting Python Standalone to $resRuntime..."
          tar -xzf $tarPath -C $resRuntime
          Remove-Item $tarPath

          # Also mirror to desktop/runtime/python
          New-Item -ItemType Directory -Force -Path "desktop/runtime"
          Copy-Item "$resRuntime/python" -Destination "desktop/runtime/" -Recurse -Force

          $bundledPy = "$resRuntime/python/python.exe"
          if (-not (Test-Path $bundledPy)) {
              Write-Error "Bundled Python executable not found at $bundledPy"
              exit 1
          }

          Write-Host "Verifying bundled Python executable:"
          & $bundledPy --version

          Write-Host "Installing Core dependencies into bundled Python..."
          & $bundledPy -m pip install --upgrade pip
          & $bundledPy -m pip install -e .

          # Populate remaining application resources inside desktop/src-tauri/resources/
          Write-Host "Populating application resources into desktop/src-tauri/resources/..."
          $resDesktop = "desktop/src-tauri/resources/desktop"
          $resSrc = "desktop/src-tauri/resources/src"
          New-Item -ItemType Directory -Force -Path $resDesktop
          New-Item -ItemType Directory -Force -Path $resSrc

          Copy-Item "desktop/ipc" -Destination "$resDesktop/" -Recurse -Force
          Copy-Item "desktop/auth" -Destination "$resDesktop/" -Recurse -Force
          Copy-Item "desktop/terminal" -Destination "$resDesktop/" -Recurse -Force
          Copy-Item "src/*" -Destination "$resSrc/" -Recurse -Force

          Write-Host "Resources directory populated successfully:"
          Get-ChildItem -Path "desktop/src-tauri/resources" | Select-Object Name

      - name: Install Desktop Frontend Dependencies
        working-directory: desktop
        run: npm install

      - name: Verify Frontend Compilation (TypeCheck + Vite Build)
        working-directory: desktop
        run: npm run build

      - name: Build Tauri 2 Native Executable & Windows Bundles
        working-directory: desktop
        run: npx @tauri-apps/cli build --debug

      - name: Package Portable Standalone Distribution
        shell: powershell
        run: |
          Write-Host "=== Preparing Portable Alpha Directory ==="
          $portableDir = "desktop/src-tauri/target/debug/portable"
          New-Item -ItemType Directory -Force -Path "$portableDir/resources"

          Copy-Item "desktop/src-tauri/target/debug/ai-coordinator-desktop.exe" -Destination "$portableDir/" -Force
          Copy-Item "desktop/src-tauri/resources/*" -Destination "$portableDir/resources/" -Recurse -Force

          Compress-Archive -Path "$portableDir/*" -DestinationPath "desktop/src-tauri/target/debug/ai-coordinator-desktop-alpha-portable.zip" -Force
          Write-Host "Portable package created at desktop/src-tauri/target/debug/ai-coordinator-desktop-alpha-portable.zip"

      - name: Compute Checksums and Export Step Summary
        shell: powershell
        run: |
          Write-Host "=== Computing SHA-256 Checksums for Windows Alpha Artifacts ==="
          $summary = @(
              "### AI Coordinator Desktop - Windows Alpha Artifacts",
              "",
              "| Arquivo | SHA-256 Checksum | Tamanho |",
              "|---|---|---|"
          )
          $artifacts = Get-ChildItem -Path "desktop/src-tauri/target/debug" -Include "*.exe", "*.msi", "*.zip" -Recurse | Where-Object { $_.FullName -notmatch "build|deps|incremental|\.fingerprint" }
          foreach ($item in $artifacts) {
              $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash
              $size = "{0:N0} bytes" -f $item.Length
              Write-Host "$($item.Name) : $hash ($size)"
              $summary += "| $($item.Name) | $hash | $size |"
          }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Archive Desktop Alpha Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-coordinator-desktop-alpha-windows
          path: |
            desktop/src-tauri/target/debug/ai-coordinator-desktop.exe
            desktop/src-tauri/target/debug/ai-coordinator-desktop-alpha-portable.zip
            desktop/src-tauri/target/debug/bundle/msi/*.msi
            desktop/src-tauri/target/debug/bundle/nsis/*.exe
          if-no-files-found: warn
