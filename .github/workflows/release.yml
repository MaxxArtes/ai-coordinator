name: Build release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish to GitHub Packages (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          registry-url: "https://npm.pkg.github.com"
          scope: "@maxxartes"

      - name: Verify package, tests, support matrix, and tag version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]" build
          python -m unittest discover -s tests -v
          python scripts/check_support_matrix.py
          python -c "import os,tomllib; from pathlib import Path; v=tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']; expected=os.environ['RELEASE_TAG'].removeprefix('v'); assert v == expected, f'tag {expected} != package {v}'"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          npm pack --dry-run --ignore-scripts ./plugins/opencode

      - name: Build Python wheel and source archive
        run: |
          python -m build --outdir dist

      - name: Package skill, Claude plugin, and OpenCode plugin
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          staging="$RUNNER_TEMP/ai-coordinator-release"
          mkdir -p "$staging/skill" "$staging/claude" "$staging/opencode" dist
          cp -R skills/ai-coordinator "$staging/skill/ai-coordinator"
          cp -R plugins/claude-code/. "$staging/claude/"
          cp -R plugins/opencode/. "$staging/opencode/"
          cp LICENSE NOTICE "$staging/skill/"
          cp LICENSE NOTICE "$staging/claude/"
          cp LICENSE NOTICE "$staging/opencode/"
          (cd "$staging/skill" && zip -qr "$GITHUB_WORKSPACE/dist/ai-coordinator-skill-${RELEASE_VERSION}.zip" .)
          (cd "$staging/claude" && zip -qr "$GITHUB_WORKSPACE/dist/ai-coordinator-claude-plugin-${RELEASE_VERSION}.zip" .)
          npm pack "$staging/opencode" --pack-destination dist

      - name: Publish GitHub Release with artifacts
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi

      - name: Publish OpenCode npm package to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --ignore-scripts ./plugins/opencode
