name: Build release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish to GitHub Packages (for example v0.2.0)
        required: true
        type: string
      confirm_publish:
        description: Explicit confirmation to publish packages (type true)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          registry-url: "https://npm.pkg.github.com"
          scope: "@maxxartes"

      - name: Verify package, tests, support matrix, and tag version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]" build
          python -m unittest discover -s tests -v
          python scripts/check_support_matrix.py
          python -c "import os,tomllib; from pathlib import Path; v=tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']; expected=os.environ['RELEASE_TAG'].removeprefix('v'); assert v == expected, f'tag {expected} != package {v}'"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          npm pack --dry-run --ignore-scripts ./plugins/opencode

      - name: Build Python distributions (wheel and sdist)
        run: |
          python -m build --outdir dist

      - name: Package and verify all 5 release artifacts
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          export RELEASE_VERSION="${RELEASE_TAG#v}"
          python scripts/package_release_artifacts.py

      - name: Verify clean install, CLI smoke, mandatory MCP extra, and genuine v0.4.0 migration
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          export RELEASE_VERSION="${RELEASE_TAG#v}"
          python scripts/verify_clean_install_and_migration.py

      - name: Generate cryptographic SHA-256 manifest
        run: |
          cd dist
          sha256sum * | tee ../checksums.sha256
          cp ../checksums.sha256 checksums.sha256
          echo "### Official SHA-256 Manifest of Published Release Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          while read -r hash file; do
            if [ "$file" != "checksums.sha256" ]; then
              echo "| \`$file\` | \`$hash\` |" >> $GITHUB_STEP_SUMMARY
            fi
          done < ../checksums.sha256
          echo "=== OFFICIAL RELEASE SHA-256 MANIFEST ==="
          cat checksums.sha256

      - name: Publish GitHub Release with artifacts and SHA-256 manifest
        if: |
          (github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && inputs.confirm_publish == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ inputs.release_tag || github.ref_name }}"
          notes="docs/releases/${TAG_NAME}.md"
          PRERELEASE_FLAG=""
          if [[ "$TAG_NAME" == *"-rc"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if [ -f "$notes" ]; then
            gh release create "$TAG_NAME" dist/* --verify-tag $PRERELEASE_FLAG --notes-file "$notes"
          else
            gh release create "$TAG_NAME" dist/* --verify-tag $PRERELEASE_FLAG --generate-notes
          fi

      - name: Publish OpenCode npm package to GitHub Packages
        if: |
          !contains(inputs.release_tag || github.ref_name, '-rc') &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_publish == true))
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --ignore-scripts ./plugins/opencode
